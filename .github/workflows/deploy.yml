name: Export and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  KOBWEB_CLI_VERSION: 0.9.23

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Kobweb CLI
        run: |
          curl -fsSL "https://github.com/varabyte/kobweb-cli/releases/download/v${KOBWEB_CLI_VERSION}/kobweb-${KOBWEB_CLI_VERSION}.zip" -o kobweb-cli.zip
          unzip kobweb-cli.zip
          echo "$PWD/kobweb-${KOBWEB_CLI_VERSION}/bin" >> $GITHUB_PATH

      - name: Export site
        run: |
          cd site
          kobweb export --notty --layout static

      # Kobweb always emits /IAmA/iama.js. GitHub Pages caches files for 10 minutes, so a browser could
      # pair a freshly deployed page with a stale cached bundle; a per-commit query string prevents that.
      - name: Version the app bundle URL
        run: |
          version="${GITHUB_SHA::8}"
          find site/.kobweb/site -name '*.html' -exec sed -i "s#/IAmA/iama.js\"#/IAmA/iama.js?v=${version}\"#g" {} +
          echo "Versioned bundle references: $(grep -rl "iama.js?v=${version}" site/.kobweb/site --include='*.html' | wc -l) pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.kobweb/site/

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
