# Cloudflare Worker backing the portfolio's visitor counter and guestbook.
# Secrets are set with `npx wrangler secret put <NAME>` and never committed:
#   TURNSTILE_SECRET  Cloudflare Turnstile secret key
#   ADMIN_TOKEN       bearer token for the /admin endpoints
#   HASH_SALT         salt for the anonymous daily visitor hash
name = "iama-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://antimkhel.github.io,http://localhost:8080"
# "Ask Ritwik" model on Workers AI (free plan: 10,000 neurons/day; past that, requests error, never bill).
ASK_MODEL = "@cf/zai-org/glm-4.7-flash"
# Voice questions: speech to text on Workers AI (~47 neurons per audio minute).
VOICE_MODEL = "@cf/openai/whisper-large-v3-turbo"
# What Ask knows: published by the site build (profile facts + every blog post). Locally, .dev.vars points
# this at the Kobweb dev server instead.
KNOWLEDGE_URL = "https://antimkhel.github.io/IAmA/knowledge.json"

# Workers AI. In `wrangler dev` this binding always calls Cloudflare (it uses a little of the daily allocation).
[ai]
binding = "AI"
remote = true

# Tests load the site's real knowledge files as text fixtures.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "iama"
# Replaced with the real id by setup.sh (`wrangler d1 create iama`).
database_id = "a73636ab-1a27-4ab3-b42d-4c6b7f78b8e4"
migrations_dir = "migrations"

# Daily cleanup of visitor hashes (only today's and yesterday's are ever kept).
[triggers]
crons = ["17 3 * * *"]
